name: khotwah
description: "Your companion in Saudi Arabia ;)."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: 4.0.4
  flutter_map: ^4.0.0
  latlong2: ^0.8.1
  url_launcher: ^6.0.20
  pin_code_fields: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "lib/Assets/icon/KhotwahWidgetApp.png"

flutter:
  uses-material-design: true
  assets:
    - "lib/Assets/icon/KhotwahWidgetApp.png"
    - "lib/Assets/things-to-do json.json"
    - lib/Assets/events js.json

